<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAMIE'S BIRTHDAY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- <nav>
        <h1>HAPPY BIRTHDAY KAMIE!</h1>
    </nav> -->
    <div class="page-welcome">
        <h1>Happy <br> Birthday,</h1>
        <div class="kam-wrapper">
            <div class="brush-bg"></div>
            <span class="kam">
               <h2>KAMIE !</h2>
               <h2 class="heart-icon">&#9825;</h2>
            </span>
          </div>
        <h3 style="color: #1f4038;"> Do you want <br/> this gift?</h3>
        <span class="btn-container">
            <button id="yes">YES</button>
            <button id="no">NO</button>
        </span>
    </div>
    <div class="page-error hide-div">
        <h1>HOW DARE YOU!</h1>
        <span class="err-flex1">
            <img src="resources/images/angry-lynx.png" class="angry-lynx">
            <h2>YOU HAD JUST ONE JOB</h2>
        </span>
        <span class="err-flex2">
            <button id="back1">GO BACK JOOR!</button>
            <img src="resources/images/angry-bear.gif" class="angry-bear">
        </span>
    </div>

    <main id="page-birthday" class="hide-div">
        <img class="hanging-polaroids" src="resources/images/hanging-polaroids.png" alt="Two hanging polaroid photos">
        <img class="bouncing-cake" src="resources/images/cake.png" alt="">
        <h1>OTANJ&#332BIOMEDET&#332 !</h1>
        <h2>Hey Pumpkin, I made you a little something. <br> Pick a page to begin.</h2>
        <div class="hub-page" id="hubPage">
            <button class="sketchbook-card hub-card" id="card-wish">
                <div class="spiral-binding">
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                </div>
                <div class="card-inner">
                  <div class="card-number">01</div>    
                    <img class="card-illustration" src="resources/images/card-cake.png" alt="">
                  <h3 class="card-title">KAMIE THE WISH</h3>
                  <p class="card-subtext">A wish is a<br>very personal thing.</p>
                  <div class="card-heart">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#1f4328">
                      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                  </div>
                </div>
              </button>
            <button class="sketchbook-card hub-card" id="card-pics">
                <div class="spiral-binding">
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                </div>
              
                
                <div class="card-inner">
                  <div class="card-number">02</div>    
                    <img class="card-illustration2" src="resources/images/card-pics.png" alt="">
                  <h3 class="card-title">KAMIE THE PICTURES</h3>
                  <p class="card-subtext">Some moments<br>deserve to be kept.</p>
                  <div class="card-heart">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#1f4328">
                      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                  </div>
                </div>
              </button>
            <button class="sketchbook-card hub-card" id="card-song">
                <div class="spiral-binding">
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                </div>
                <div class="card-inner">
                  <div class="card-number">03</div>    
                    <img class="card-illustration3" src="resources/images/card-song.png" alt="">
                  <h3 class="card-title">KAMIE THE SONG</h3>
                  <p class="card-subtext">Ten Songs. Ten little pieces<br>of a soundtrack.</p>
                  <div class="card-heart">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#1f4328">
                      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                  </div>
                </div>
              </button>
            <button class="sketchbook-card hub-card" id="card-kam">
                <div class="spiral-binding">
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                </div>
                <div class="card-inner">
                  <div class="card-number">04</div>    
                    <img class="card-illustration4" src="resources/images/card-kam.png" alt="">
                  <h3 class="card-title">KAMIE THE PERSON</h3>
                  <p class="card-subtext">Let's talk<br>about you.</p>
                  <div class="card-heart">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#1f4328">
                      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                  </div>
                </div>
              </button>
            <button class="sketchbook-card hub-card" id="card-letter">
                <div class="spiral-binding">
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                  <span class="ring"></span>
                </div>
                <div class="card-inner">
                  <div class="card-number">05</div>    
                    <img class="card-illustration2" src="resources/images/card-letter.png" alt="">
                  <h3 class="card-title">KAMIE THE LETTER</h3>
                  <p class="card-subtext">And finally ...<br>something from me, to you.</p>
                  <div class="card-heart">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#1f4328">
                      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                  </div>
                </div>
              </button>
        </div>
    </main>

    
    <div id="goodGirlOverlay" class="hide-div">
        <h1>GOOD GIRL</h1>
    </div>
    <audio id="birthdayMusic" loop preload="auto">
        <source src="resources/Cat-Burns-Theres-Just-Something-About-Her-(CeeNaija.com).mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
